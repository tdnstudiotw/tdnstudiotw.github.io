<!doctype html>
<html lang="zh-Hant" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf5" />
    <meta name="description" content="本地 Markdown Blog 編輯器。" />
    <title>Markdown Editor｜Blog</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem('site-theme');
        const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = savedTheme || preferredTheme;
      })();
    </script>
  </head>
  <body>
    <header class="editor-header">
      <div class="editor-brand"><a class="back-to-blog" href="../">← Blog</a><span class="brand-divider"></span><div><strong>Markdown Editor</strong><small>LOCAL WRITING DESK</small></div></div>
      <div class="editor-header-actions"><span class="local-badge"><i></i> LOCAL ONLY</span><button class="theme-toggle" type="button" data-theme-toggle aria-label="切換深色模式" aria-pressed="false"><svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg><svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z" /></svg><span class="sr-only">切換主題</span></button></div>
    </header>

    <main class="editor-shell">
      <aside class="editor-sidebar">
        <div class="sidebar-actions"><button class="button button-primary button-small" type="button" data-new>＋ 新文章</button><button class="button button-ghost button-small" type="button" data-open-file>開啟 .md</button><input class="sr-only" type="file" data-file-input accept=".md,text/markdown" /></div>
        <button class="folder-button" type="button" data-open-folder><span class="folder-icon">▣</span><span><strong>連接 Blog 資料夾</strong><small>可直接讀寫 posts/</small></span><span class="folder-arrow">↗</span></button>
        <div class="sidebar-section-head"><span>文章檔案</span><button type="button" class="refresh-button" data-refresh aria-label="重新整理文章檔案">↻</button></div>
        <div class="folder-status" data-folder-status>尚未連接本地資料夾。<br />可先用開啟或下載功能。</div>
        <div class="file-list" data-file-list></div>
        <div class="sidebar-bottom"><button class="sidebar-link" type="button" data-save-index>↳ 更新 articles.js</button><button class="sidebar-link" type="button" data-save-draft>⌁ 儲存瀏覽器草稿</button></div>
      </aside>

      <section class="editor-main">
        <div class="editor-toolbar"><div class="toolbar-group"><button class="icon-button" type="button" data-format="bold" title="粗體"><strong>B</strong></button><button class="icon-button" type="button" data-format="italic" title="斜體"><em>I</em></button><button class="icon-button" type="button" data-format="heading" title="標題">H</button><button class="icon-button" type="button" data-format="quote" title="引用">❝</button><button class="icon-button" type="button" data-format="code" title="程式碼">&lt;/&gt;</button><button class="icon-button" type="button" data-format="list" title="清單">☷</button><button class="icon-button image-button" type="button" data-image title="插入圖片">▧</button><input class="sr-only" type="file" data-image-input accept="image/*" multiple /><button class="icon-button embed-button" type="button" data-embed-toggle title="插入外部內容">◈</button></div><div class="toolbar-group toolbar-right"><span class="save-state" data-save-state>尚未儲存</span><button class="button button-ghost button-small" type="button" data-download>下載 Markdown</button><button class="button button-primary button-small" type="button" data-save-file>儲存到資料夾</button></div></div>
        <div class="embed-panel" data-embed-panel hidden><div class="embed-panel-head"><strong>插入外部內容</strong><button class="embed-close" type="button" data-embed-close aria-label="關閉嵌入面板">×</button></div><div class="embed-panel-fields"><label><span>平台</span><select data-embed-provider><option value="auto">自動辨識</option><option value="threads">Threads</option><option value="instagram">Instagram</option><option value="twitter">X / Twitter</option><option value="youtube">YouTube</option><option value="vimeo">Vimeo</option><option value="spotify">Spotify</option><option value="soundcloud">SoundCloud</option><option value="codepen">CodePen</option><option value="gist">GitHub Gist</option><option value="reddit">Reddit</option><option value="tiktok">TikTok</option></select></label><label class="embed-url-field"><span>內容網址</span><input data-embed-url-input type="url" placeholder="貼上公開貼文、影片或內容網址" /></label><button class="button button-primary button-small" type="button" data-insert-embed>插入嵌入</button></div><p class="embed-help">文章會保存為簡短標記，發布時再由指定平台載入內容。</p></div><div class="metadata-grid"><label><span>ID</span><input data-meta="id" value="0004" /></label><label class="metadata-title"><span>標題</span><input data-meta="title" placeholder="文章標題" /></label><label><span>日期</span><input data-meta="date" type="date" /></label><label><span>分類</span><input data-meta="category" placeholder="例如：專案紀錄" /></label><label><span>標籤</span><input data-meta="tags" placeholder="以逗號分隔，例如：網站, 設計" /></label><label class="metadata-summary"><span>摘要</span><input data-meta="summary" placeholder="列表頁會顯示的文章摘要" /></label></div>
        <div class="workspace"><div class="pane editor-pane"><div class="pane-head"><span>MARKDOWN</span><span data-word-count>0 words</span></div><textarea data-editor spellcheck="false" placeholder="從這裡開始寫 Markdown…\n\n使用 # 建立標題、**文字** 建立粗體，或按上方工具列插入格式。"></textarea></div><div class="pane preview-pane"><div class="pane-head"><span>LIVE PREVIEW</span><span class="preview-dot"><i></i> LIVE</span></div><article class="markdown-preview" data-preview><div class="preview-empty">開始寫作後，預覽會出現在這裡。</div></article></div></div>
      </section>
    </main>
    <div class="toast" data-toast role="status" aria-live="polite"></div>
    <script src="../embed.js"></script>
    <script src="./editor.js"></script>
  </body>
</html>
