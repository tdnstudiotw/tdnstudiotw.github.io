            <span>官方更新 <strong id="meta-updated">—</strong></span>
            <span>本站更新 <strong id="meta-fetched">—</strong></span>

            <p id="error-message" class="error-message"></p>
            <div class="error-actions">

              <a class="button button-ghost" href="https://www.dgpa.gov.tw/typh/daily/nds.html" target="_blank" rel="noreferrer">前往人事行政總處 ↗</a>
